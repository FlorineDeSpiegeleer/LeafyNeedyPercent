name: Deploy AprilTag app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AprilTag tester
        # NIEUW: vite.config.ts eist deze twee omgevingsvariabelen altijd
        # (ook bij een gewone build, waar PORT eigenlijk niet gebruikt
        # wordt). Zonder deze regel stopt de build hier meteen met
        # "PORT environment variable is required but was not provided."
        # BASE_PATH moet overeenkomen met het GitHub Pages-pad van deze
        # repo — voor een gewone projectpagina is dat /<repo-naam>/.
        env:
          PORT: "5000"
          BASE_PATH: "/LeafyNeedyPercent/"
        run: pnpm --filter @workspace/apriltag-tester build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/apriltag-tester/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
